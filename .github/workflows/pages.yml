name: Deploy scripts to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:bookworm-slim
            install: apt-get update && apt-get install -y bash git shellcheck gawk findutils
          - name: Arch
            image: archlinux:base
            install: pacman -Syu --noconfirm bash git shellcheck gawk findutils
    name: Validate on ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: Install test dependencies
        run: ${{ matrix.install }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Bash syntax
        run: bash -n linux/dev-server/setup.sh tests/*.bash

      - name: Run ShellCheck
        run: shellcheck --severity=warning linux/dev-server/setup.sh tests/*.bash

      - name: Run behavioral and publication tests
        run: bash tests/run.bash

      - name: Check whitespace
        run: git diff --check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
